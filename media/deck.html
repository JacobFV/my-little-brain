<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Little Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700&display=swap">
<style>
  /* Judges deck. Open in Chrome · ← → / space / click · F = fullscreen. */
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; overflow:hidden; background:#cfdcfb; font-family:'Inter Tight', system-ui, sans-serif; color:#fff; }
  .stage { position:fixed; left:50%; top:50%; width:1920px; height:1080px; transform-origin:0 0; overflow:hidden; background:#cfdcfb; }

  /* one color field: a few huge, heavily blurred blobs that breathe; slides re-frame it */
  .field { position:absolute; inset:-200px; filter:blur(110px) saturate(1.15); transition:transform 1.8s cubic-bezier(.2,.7,.2,1); }
  .b { position:absolute; border-radius:50%; animation:breathe 16s ease-in-out infinite alternate; }
  @keyframes breathe { to { transform:translate(70px,-50px) scale(1.12) rotate(8deg); } }

  .slide { position:absolute; inset:0; opacity:0; transition:opacity 1.1s ease; pointer-events:none; }
  .slide.on { opacity:1; }
  .word { position:absolute; top:470px; font-size:96px; font-weight:700; letter-spacing:-.035em; line-height:.95; }
  .small { position:absolute; top:586px; font-weight:500; font-size:30px; letter-spacing:-.01em; opacity:.9; }

  /* visuals dissolve into the field through a soft mask — no frames, no cards */
  .masked { position:absolute; left:510px; top:90px; width:900px; height:900px;
            -webkit-mask-image:radial-gradient(closest-side, #000 50%, transparent 100%);
            mask-image:radial-gradient(closest-side, #000 50%, transparent 100%); }
  video.masked { object-fit:contain; }
  .pager { position:fixed; right:26px; bottom:20px; font:500 13px 'Inter Tight', sans-serif; color:rgba(255,255,255,.7); letter-spacing:2px; z-index:5; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="field" id="field">
    <div class="b" style="left:-40px;top:40px;width:620px;height:820px;background:#ff3b2f"></div>
    <div class="b" style="left:120px;top:-120px;width:520px;height:520px;background:#ffcf6b;animation-delay:-3s"></div>
    <div class="b" style="left:640px;top:200px;width:820px;height:760px;background:#b07de0;animation-delay:-6s"></div>
    <div class="b" style="left:900px;top:520px;width:640px;height:620px;background:#ff6a1a;animation-delay:-9s"></div>
    <div class="b" style="left:1180px;top:240px;width:420px;height:560px;background:#ffd36e;animation-delay:-2s"></div>
    <div class="b" style="left:780px;top:640px;width:420px;height:420px;background:#ff4f8b;animation-delay:-11s"></div>
    <div class="b" style="left:1720px;top:-60px;width:520px;height:520px;background:#c78cff;animation-delay:-5s"></div>
    <div class="b" style="left:1500px;top:900px;width:700px;height:460px;background:#6fa8ff;animation-delay:-7s"></div>
    <div class="b" style="left:-160px;top:760px;width:520px;height:460px;background:#7fb2ff;animation-delay:-4s"></div>
  </div>

  <!-- 1 · the brain -->
  <section class="slide on">
    <video class="masked" src="brain/real-brain.webm" poster="brain/real-brain.png" autoplay loop muted playsinline
           style="left:610px;width:700px"></video>
    <div class="word" style="left:150px">My Little</div>
    <div class="word" style="left:1450px">Brain</div>
  </section>

  <!-- 2 · it knows you -->
  <section class="slide">
    <canvas class="masked" id="eeg" width="900" height="900"></canvas>
    <div class="word" style="left:150px">It knows</div>
    <div class="word" style="left:1460px">you</div>
    <div class="small" style="left:154px">your notes · your live EEG</div>
  </section>

  <!-- 3 · it studies itself, on quantum hardware -->
  <section class="slide">
    <canvas class="masked" id="collapse" width="900" height="900"></canvas>
    <div class="word" style="left:150px">It studies</div>
    <div class="word" style="left:1440px">itself</div>
    <div class="small" style="left:154px">256 hypotheses · 8 qubits</div>
    <div class="small" style="left:1444px">found in 48</div>
    <div class="small" style="left:0;right:0;top:auto;bottom:56px;text-align:center;font-size:22px;opacity:.7">Gemini · IonQ · IBM · qBraid · Extropic — model hypotheses, not diagnoses</div>
  </section>
</div>
<div class="pager" id="pager"></div>

<script>
const stage = document.getElementById('stage'), field = document.getElementById('field');
const slides = [...document.querySelectorAll('.slide')];
let cur = 0, t0 = 0;
const frames = ['translate(0,0) scale(1)', 'translate(-120px,40px) scale(1.08) rotate(-4deg)', 'translate(80px,-60px) scale(1.12) rotate(5deg)'];
function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `scale(${s}) translate(-50%,-50%)`; }
function go(i) {
  cur = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((el, k) => el.classList.toggle('on', k === cur));
  field.style.transform = frames[cur];
  document.getElementById('pager').textContent = `${cur + 1} / ${slides.length}`;
  t0 = performance.now();
}
addEventListener('resize', fit);
addEventListener('keydown', (e) => {
  if (['ArrowRight', ' ', 'PageDown', 'Enter'].includes(e.key)) go(cur + 1);
  if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) go(cur - 1);
  if (e.key === 'f') document.documentElement.requestFullscreen?.();
});
addEventListener('click', (e) => go(e.clientX > innerWidth / 3 ? cur + 1 : cur - 1));

const W = 'rgba(255,255,255,';
// eight EEG traces, white, drifting
const eeg = document.getElementById('eeg').getContext('2d');
function drawEEG(t) {
  eeg.clearRect(0, 0, 900, 900);
  for (let c = 0; c < 8; c++) {
    const y0 = 170 + c * 80;
    eeg.strokeStyle = W + (.55 + .05 * c) + ')'; eeg.lineWidth = 3; eeg.beginPath();
    for (let x = 0; x <= 900; x += 4) {
      const s = t / 1000 + x / 90;
      const v = Math.sin(s * (2 + c * .3)) * 9 + Math.sin(s * 10.3 + c) * 6 * (c === 7 ? 2.2 : 1) + Math.sin(s * .7 + c * 2) * 12;
      x ? eeg.lineTo(x, y0 + v) : eeg.moveTo(x, y0 + v);
    }
    eeg.stroke();
  }
}
// 256 hypotheses collapse onto one
const cc = document.getElementById('collapse').getContext('2d');
const seed = Array.from({ length: 256 }, (_, i) => .25 + .75 * Math.abs(Math.sin(i * 12.9898) * 43758.5453 % 1));
function drawCollapse(t) {
  cc.clearRect(0, 0, 900, 900);
  const k = Math.min(1, Math.max(0, (t - t0 - 700) / 3000)), e = k * k * (3 - 2 * k), target = 137;
  for (let i = 0; i < 256; i++) {
    const h = (1 - e) * seed[i] + e * (i === target ? 1 : Math.exp(-Math.abs(i - target) / 3) * .18);
    const x = 150 + (i % 16) * 40, yy = 150 + Math.floor(i / 16) * 40;
    cc.fillStyle = W + (.2 + .8 * h) + ')';
    cc.beginPath(); cc.arc(x, yy, 3 + 11 * h, 0, 7); cc.fill();
    if (i === target && e > .6) { cc.strokeStyle = W + '.6)'; cc.lineWidth = 3; cc.beginPath(); cc.arc(x, yy, 24 + 6 * Math.sin(t / 220), 0, 7); cc.stroke(); }
  }
}
function frame(t) {
  if (cur === 1) drawEEG(t);
  if (cur === 2) drawCollapse(t);
  requestAnimationFrame(frame);
}
fit(); go(0); requestAnimationFrame(frame);
</script>
</body>
</html>
