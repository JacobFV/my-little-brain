name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/backend/requirements.txt
      - run: python -m pip install -r research/backend/requirements.txt pytest httpx brainflow websockets
      - run: python -m pytest -q research/backend/tests
      - run: python -m py_compile research/bridge/openbci.py research/experiments/benchmark.py
      - run: npm run build --workspace=@little-brain/web
        env:
          VITE_CORTEX_ONLY: '1'
      - run: npm run cloudflare:prepare
      - run: npm run export:mobile
