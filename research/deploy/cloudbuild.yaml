# gcloud builds submit --config research/deploy/cloudbuild.yaml --substitutions=_IMAGE=...,_GOOGLE_CLIENT_ID=...,_VERSION=...
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "research/Dockerfile",
           "--build-arg", "VITE_GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}",
           "--build-arg", "CORTEX_VERSION=${_VERSION}",
           "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
